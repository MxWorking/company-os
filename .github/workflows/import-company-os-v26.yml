name: Import original Company OS 2.6 source
on:
  push:
    branches: [company-os-v2.6]
    paths: [.github/workflows/import-company-os-v26.yml]
permissions:
  contents: write
concurrency:
  group: company-os-v26-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: company-os-v2.6
          persist-credentials: true
      - name: Download exact user-provided source and verify SHA256
        shell: bash
        env:
          SOURCE_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3FaItIwvk8FqJpTDPRXEKeKEM3D/3880ba32-e5c9-4209-b951-7cf012bd1e25.zip"
          EXPECTED_SHA: "e838072370c10aad7a23ec066d944722c9713e00d19e3f38ccb86fc7f733ed98"
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-all-errors --max-time 180 "$SOURCE_URL" -o "$RUNNER_TEMP/company-os-source.zip"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/company-os-source.zip" | sha256sum --check --status
      - name: Validate archive paths and extract without overwriting checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "company-os-import"
          archive = Path(os.environ["RUNNER_TEMP"]) / "company-os-source.zip"
          root.mkdir()
          with zipfile.ZipFile(archive) as z:
              files = z.infolist()
              assert len(files) == 119, "unexpected number of archive entries"
              assert z.testzip() is None, "archive CRC error"
              for f in files:
                  p = Path(f.filename)
                  assert p.parts and p.parts[0] == "company-os", "unexpected archive root"
                  assert not p.is_absolute() and ".." not in p.parts, "unsafe path"
                  assert not any(part == ".git" for part in p.parts), "git metadata in archive"
                  assert not any(part == ".env" for part in p.parts), "real secret file in archive"
                  assert not stat.S_ISLNK(f.external_attr >> 16), "symlink in archive"
              z.extractall(root)
          assert (root/"company-os"/"frontend"/"components"/"CompanyOS.tsx").is_file()
          assert (root/"company-os"/"backend"/"main.py").is_file()
          PY
      - name: Replace placeholder code with full v2.6, keeping LICENSE
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='LICENSE' --exclude='.github/workflows/' "$RUNNER_TEMP/company-os-import/company-os/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "feat: restore complete user-provided Company OS 2.6 source"
            git push origin HEAD:company-os-v2.6
          fi
